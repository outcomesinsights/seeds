# TRANSITION wiring. prek still owns .git/hooks here (core.hooksPath unset,
# seeds-29i) until seeds moves to gator's tracked .githooks/, whose hooks run the
# same two recipes directly: `just pre-commit` at commit, `just ci` at push. So
# this file only forwards to the justfile, and the gate and `just ci` cannot drift.
# Install BOTH hook types, or the push stage never fires:
#   prek install --hook-type pre-commit --hook-type pre-push
#
# A hook with no `stages:` runs in EVERY installed stage, so without this the
# commit-stage hook ran a second time at push (measured 2026-09-30).
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # git-config-sanity, fmt-check, lint and seeds-check: see the recipe. The
      # suite is not here; it runs at push. Confirm an intended mass rewrite of
      # the seed store with `SEEDS_GATE_CONFIRM=1 git commit`, never --no-verify.
      - id: just-pre-commit
        name: just pre-commit (sanity, fmt-check, lint, seeds-check)
        entry: just pre-commit
        language: system
        pass_filenames: false
        always_run: true

      # Publish first, so beads leave this host even when the code gate below
      # refuses the push. refs/dolt/data is a non-branch ref that `git push`
      # does not carry, so this is the only thing that publishes them
      # (seeds-tkk). Guarded: a host or clone without bd-publish skips it.
      - id: beads-publish
        name: bd dolt push (publish this host's beads)
        entry: sh -c 'command -v bd-publish >/dev/null 2>&1 || exit 0; bd-publish'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The push gate: the full local CI equivalent, the same recipe CI runs.
      - id: just-ci
        name: just ci (the full local CI equivalent)
        entry: just ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
