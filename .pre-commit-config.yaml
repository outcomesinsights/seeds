repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Runs first, and deliberately before pytest: on 2026-08-26 a test
      # fixture in an agent worktree wrote core.bare=true plus a test identity
      # into this repo's shared .git/config, and the only symptom was git
      # refusing every command with "fatal: this operation must be run in a
      # work tree". Nothing connected that to the config for ~20 minutes.
      # tests/conftest.py catches the write as it happens; this catches a
      # config already poisoned, and prints the repair. See bead seeds-p0x.
      - id: git-config-sanity
        name: git config sanity (not bare, no test identity)
        entry: python3 scripts/check_git_config_sanity.py
        language: system
        pass_filenames: false
        always_run: true

      # pre-push, but declared HERE rather than in the pre-push section below,
      # because it has to run before every other uv-invoking hook. `uv sync`
      # and `uv run` both re-lock by default and rewrite uv.lock in place,
      # after which `uv lock --check` passes unconditionally. Measured on titan
      # 2026-08-31: with click's floor bumped and the lock left stale, `uv lock
      # --check` exited 1; a single `uv sync --dev` changed uv.lock's md5 and
      # the same check exited 0. The hooks below (pytest, mypy, ruff) all shell
      # out through `uv run`, so anywhere after them this gate is a permanent
      # no-op that reports green.
      #
      # Deliberately NOT a commit-stage hook: Dependabot merges arrive on main
      # without ever passing through a local commit, and that is precisely the
      # path that shipped the stale lock in e789ac8. git-config-sanity stays
      # ahead of it: that one diagnoses a poisoned .git/config, which would
      # otherwise garble every failure reported after it.
      - id: uv-lock-check
        name: uv lock --check (uv.lock matches pyproject.toml)
        entry: uv lock --check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # The only gate on store integrity that actually holds. Claude Code's
      # PostToolUse hooks fire on the Write/Edit *tools*, and an agent reaching
      # a file through `bash -c 'cat > …'`, `sed -i` or a Python one-liner --
      # most agent file access in practice -- never fires them. Everything
      # reaches a commit eventually, so this is where detection has to live.
      # See bead seeds-4co.13 and the script's own docstring.
      #
      # Runs violations (blocks), --against-git (blocks on one field rewritten
      # across >=20% of the corpus AND >=10 seeds, which also subsumes gating
      # D/R in `git diff --name-status`: there is no delete verb, so without it
      # `rm <seed-file>` is the de facto one), and --smells (never blocks, by
      # construction in the command itself).
      #
      # Deliberately ahead of pytest: a corrupt store is a data problem, and
      # reading it first is cheaper and more urgent than a red test.
      #
      # The script wraps the command for two reasons only -- a missing
      # .seeds/seeds/ must not block commits before the conversion lands, and a
      # blocked commit has to name its escape hatch. Confirm an intended mass
      # rewrite with `SKIP=seeds-check git commit`, never --no-verify.
      #
      # Expect to need SKIP TWICE for one intended mass rewrite. When the store
      # is unchanged relative to HEAD, --against-git falls back to comparing
      # HEAD~1 with HEAD and audits the commit that just landed -- which is the
      # reading seeds-wurl needed, since that rewrite survived three days and
      # three further commits. The next commit after that clears it.
      #
      # pre-commit hides a passing hook's output, so the smells tier is silent
      # in normal use; see it with `pre-commit run --verbose seeds-check`.
      - id: seeds-check
        name: seeds check (violations + mass-rewrite gate)
        entry: uv run python scripts/seeds_check_hook.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest -x -q
        language: system
        pass_filenames: false
        always_run: true

      - id: beads-pre-commit
        name: beads pre-commit
        # BD_GIT_HOOK=1 mirrors the .beads/hooks/pre-commit shim so bd knows it
        # runs inside a commit and suppresses its racing auto-export `git add`
        # (which otherwise fails on .git/index.lock and trips pre-commit).
        entry: env BD_GIT_HOOK=1 bd hooks run pre-commit
        language: system
        pass_filenames: false
        always_run: true

      # bd's own racing auto-export is suppressed above (BD_GIT_HOOK=1) and
      # `bd hooks run pre-commit` does not otherwise write .beads/issues.jsonl,
      # so export the Dolt DB to it explicitly here. Without this a `bd create`
      # survives in Dolt but a plain `git commit` silently omits it (this
      # stranded seeds-5uw). `bd export` is synchronous, so it avoids the
      # index.lock race the native auto-export hits.
      - id: beads-export
        name: beads export (db -> tracked JSONL)
        entry: bash -c 'bd export -o .beads/issues.jsonl && git add .beads/issues.jsonl'
        language: system
        pass_filenames: false
        always_run: true

      # --- pre-push: run the same checks CI runs, so CI on remote is the last
      # line of defense, not the first. Covers ALL THREE jobs in
      # .github/workflows/ci.yml — lint, test (all four Python versions), and
      # nix. Measured ~79s on titan for the full stage.
      #
      # One pre-push hook is NOT in this section: uv-lock-check, declared above
      # with the commit-stage hooks. It mirrors the lint job's `uv lock --check`
      # and has to precede every `uv run`; the comment there explains why.
      #
      # The single deliberate exception: CI passes --cov to pytest, this does
      # not. There is no fail-under anywhere, so coverage is report-only and
      # gates nothing; running it here would cost time and change no outcome.
      #
      # If you add a step to ci.yml, add it here too — the contract this
      # section exists to uphold is "if pre-push passes, CI passes," and it is
      # only worth anything while it stays literally true.
      #
      # That contract is one-directional, so one hook here has no ci.yml
      # counterpart on purpose: flake-deps-check. CI already catches that
      # mismatch inside the nix job; the hook only makes it fail in
      # milliseconds instead of two minutes, and an extra local check never
      # weakens "pre-push passing implies CI passing".
      - id: mypy-pre-push
        name: mypy (strict)
        entry: uv run mypy src/
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: ruff-check-pre-push
        name: ruff check
        entry: uv run ruff check .
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: ruff-format-pre-push
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: pytest-pre-push
        name: pytest (full suite)
        entry: uv run pytest
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # ci.yml runs pytest across 3.11-3.13; the hook above only exercises the
      # local interpreter. Cover the rest here so "pre-push passed" actually
      # implies "CI will pass" — otherwise two of the three supported versions
      # are unverified until billed CI minutes discover the problem.
      # Measured on titan: ~29s for three. 3.13 is deliberately omitted;
      # it is the local interpreter and is already covered above.
      - id: pytest-matrix-pre-push
        name: pytest (3.11, 3.12)
        entry: bash -c 'for v in 3.11 3.12; do echo "--- python $v ---"; uv run --python "$v" --no-sync pytest -q || exit 1; done'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # The cheap half of the nix job below, run first so it fails in
      # milliseconds instead of two minutes. flake.nix hand-mirrors
      # pyproject.toml's [project.dependencies]; nothing kept them in step, and
      # on 2026-08-31 dropping flask from pyproject.toml left flake.nix naming
      # it while ruff, mypy, the full pytest suite and `uv lock --check` all
      # reported green. `nix flake check --print-build-logs` was the only
      # detector, ~2min cold. See bead seeds-8ro.
      #
      # This does NOT replace the nix job: a name comparison cannot see a floor
      # nixpkgs-unstable cannot satisfy, or any other build failure. It moves
      # the dependency-drift half of that signal to the front.
      #
      # Deliberately ahead of nix-pre-push and NOT inside it: that hook skips
      # cleanly when nix is absent (this repo is public), and a contributor
      # without nix must still be told when they have desynced the two files.
      #
      # `python3`, not `uv run` — the script is pure stdlib (tomllib + re), so
      # this stays independent of the uv re-lock ordering hazard documented on
      # uv-lock-check above. Same reasoning as git-config-sanity.
      - id: flake-deps-check
        name: flake.nix mirrors [project.dependencies]
        entry: python3 scripts/flake_deps_check.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # Mirrors the `nix` job in ci.yml verbatim. Flakes are enabled globally
      # in nix.conf here, so no --extra-experimental-features — same as CI; a
      # misconfigured local nix should fail loudly rather than be papered over.
      #
      # Skips cleanly when nix is absent: this repo is public, and a
      # contributor without nix must not be blocked from pushing. Measured
      # ~7s warm; the first run after a flake.lock change is much slower.
      - id: nix-pre-push
        name: nix flake check (matches ci.yml nix job)
        entry: bash -c 'command -v nix >/dev/null 2>&1 || { echo "nix not on PATH — skipping (CI still runs this job)"; exit 0; }; nix flake check --all-systems --no-build && nix flake check --print-build-logs && nix run . -- --version'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: beads-pre-push
        name: beads pre-push
        entry: bd hooks run pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
