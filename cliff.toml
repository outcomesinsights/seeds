# git-cliff config — see https://git-cliff.org/docs/configuration
#
# Strategy: git-cliff owns the [Unreleased] section of CHANGELOG.md only.
# Hand-written entries for v0.1.0–v0.3.0 stay as-is. At release time, the
# author runs `just changelog`, reviews the generated section, then bumps
# [Unreleased] → [X.Y.Z] manually in CHANGELOG.md and copies the notes to
# the matching GitHub Release.

[changelog]
# Empty header — we don't regenerate the file's top matter.
header = ""

# Per-release body. For [Unreleased] (no version), we just produce the
# grouped sections; the author will paste them into CHANGELOG.md.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\\n") | first | upper_first | trim }}{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/outcomesinsights/seeds/commit/{{ commit.id }})){% endif %}
{% endfor %}
{%- endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
# Drop commits that don't match conventional-commit shape — keeps the
# changelog clean of stray "wip" or merge commits.
filter_unconventional = true
# Don't show commits that match `commit_parsers` `skip = true`.
filter_commits = true
topo_order = false
sort_commits = "newest"

# Parser order matters — first match wins. Specific patterns before catch-alls.
commit_parsers = [
    # Skip noise that isn't user-facing
    { message = "^chore\\(beads\\)", skip = true },
    { message = "^chore\\(seeds[a-z0-9.,_-]*\\)", skip = true },
    { message = "^chore: bump version", skip = true },
    { message = "^chore: pick up ruff", skip = true },
    { message = "^chore: ruff", skip = true },
    { message = "^chore: post-feature cleanup", skip = true },
    { message = "^chore\\(hooks\\)", group = "Tooling" },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    # `seeds:` subjects are captures into this repo's own deliberation
    # database (.seeds/) — design notes, not shipped code.
    { message = "^seeds", skip = true },
    # Same reasoning for `docs(seeds…)`: these edit seed CONTENT in .seeds/,
    # not user-facing documentation, so they are not a changelog entry.
    # `chore(seeds…)` was already skipped and this was not, so two seed edits
    # leaked into 0.6.0's generated Documentation section and had to be
    # removed by hand. Keep the two scopes in agreement.
    { message = "^docs\\(seeds[a-z0-9.,_-]*\\)", skip = true },
    { message = "^ci", group = "Tooling" },

    # Real groups, mapped to Keep a Changelog headings
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    # A packaging change like a Python-floor bump is user-facing behaviour,
    # not tooling noise — it belongs under Changed, where a reader looking
    # for "what broke for me" will actually find it.
    { message = "^build", group = "Changed" },
    { message = "^chore", group = "Tooling" },

    # Catch-all — deliberately NOT a silent skip.
    #
    # Every type this repo has used is handled above. Audit over the full
    # history, 2026-08-31 (`git log --format=%s | sed 's/[(:].*//' |
    # sort | uniq -c`): chore, feat, fix, docs, test, style, ci, build,
    # refactor, perf, seeds. The ones dropped on purpose are the explicit
    # `skip = true` entries at the top of this table; merge commits and
    # other unconventional subjects are dropped earlier by
    # filter_unconventional.
    #
    # Anything else is a type nobody has taught this file about, so it
    # renders loudly under its own heading rather than vanishing. Twice a
    # release nearly shipped with real work missing because a commit was
    # dropped without a word (seeds-gzf7, then seeds-3sh: `build: raise the
    # Python floor to 3.11`, the most user-affecting change in 0.6.0). An
    # untidy line in the generated notes is strictly better than an
    # omission nobody can see.
    #
    # If a commit turns up under "Uncategorized", either give its type a
    # group or give it an explicit skip above — do not re-silence this.
    { message = ".*", group = "Uncategorized" },
]

[remote.github]
owner = "outcomesinsights"
repo = "seeds"
