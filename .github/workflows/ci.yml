name: CI

on:
  # Release branches are matched too, not just main. Until 2026-09-23 this was
  # `[main]` alone, so the 0.7.0 branch went 213 commits and seven alphas
  # without a single CI run — and was carrying a mypy error and two ruff
  # findings by the time anyone looked. A branch nobody merges from is exactly
  # where an unlinted commit hides longest.
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    # Commits that touch only the seed store, beads or agent scratch change
    # nothing CI checks: 45 of 112 commits in the 30 days to 2026-10-12. docs/
    # and *.md are NOT here: the suite reads tracked markdown (SKILL.md, README).
    paths-ignore:
      - ".seeds/**"
      - ".beads/**"
      - ".claude/**"
      - "claude_stuff/**"
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# N pushes in a row cost one run, not N.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job running `just ci`, the same recipe the push gate runs, so "if the
  # push gate passes, CI passes" holds by construction. `just ci` runs the
  # serial checks (lock, lint, fmt-check, flake-deps, seeds-check), then the
  # suite on the default interpreter, 3.11 and 3.12, and the nix flake check,
  # concurrently. See the recipe for why each is there.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # cog check reads the commit subjects since the last tag
      # Enables nix-command and flakes, so `just nix-check` needs no extra flags.
      # Its comments explain the two-run split of `nix flake check`.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1" # the mise pin; zizmor fails the step without it
      # `seeds search` shells out to ripgrep, and so do a dozen tests. The
      # ubuntu-latest image ships it today; making the dependency explicit means
      # a runner-image change fails here with one clear line instead of twelve
      # obscure ones inside pytest.
      - run: rg --version || (sudo apt-get update && sudo apt-get install -y ripgrep)
      # `uv sync --locked`: a stale uv.lock fails here rather than being
      # silently re-locked (bead seeds-3p1).
      - run: just setup
      - run: just ci
