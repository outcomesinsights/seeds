name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest --cov=seeds --cov-report=term-missing

  # A flake that silently rots is worse than no flake: once the README documents
  # `nix run github:outcomesinsights/seeds`, that path has to keep working, and
  # nothing else in CI exercises it. This job is also the only thing that notices
  # when a dependency floor in pyproject.toml outruns what nixpkgs-unstable ships.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enables the nix-command and flakes experimental features by default, so
      # the steps below need no --extra-experimental-features.
      - uses: DeterminateSystems/nix-installer-action@main
      # `flake check` — not `build` — because the pytest suite hangs off
      # checks.default; packages.default deliberately keeps doCheck off.
      #
      # --all-systems EVALUATES every system the flake declares, but only BUILDS
      # the runner's own (x86_64-linux) — nix skips derivations it cannot build
      # here, and we deliberately add no emulation or remote builders. So the
      # aarch64 systems get evaluation coverage only, and the pytest suite runs
      # once, natively. That is not a gap: the failure this guards against
      # (seeds-808, nixpkgs 26.11 dropping x86_64-darwin) was an evaluation-time
      # error, which is exactly what bare `flake check` missed and this catches.
      - run: nix flake check --all-systems --print-build-logs
      - run: nix run . -- --version
