name: CI

on:
  # Release branches are matched too, not just main. Until 2026-09-23 this was
  # `[main]` alone, so the 0.7.0 branch went 213 commits and seven alphas
  # without a single CI run — and was carrying a mypy error and two ruff
  # findings by the time anyone looked. A branch nobody merges from is exactly
  # where an unlinted commit hides longest.
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    # Commits that touch only the seed store, beads or agent scratch change
    # nothing CI checks: 45 of 112 commits in the 30 days to 2026-10-12. docs/
    # and *.md are NOT here: the suite reads tracked markdown (SKILL.md, README).
    paths-ignore:
      - ".seeds/**"
      - ".beads/**"
      - ".claude/**"
      - "claude_stuff/**"
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# N pushes in a row cost one run, not N.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `just ci` is the push gate, and it runs every recipe below on one machine.
  # CI runs the same recipes, one per runner, so they finish sooner. Each job
  # runs only a recipe that `just ci` also runs, so "if the push gate passes,
  # CI passes" still holds. To add a check, add it to a recipe `ci` runs,
  # never to this workflow alone.

  # The versions to test come from the justfile, so `matrix` there is the one
  # list: its versions, plus the pin in .python-version, which runs `just test`.
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1" # the mise pin; zizmor fails the step without it
      - id: list
        run: |
          list=$(just --evaluate matrix | jq -Rc --arg pin "$(cat .python-version)" 'split(" ") + [$pin]')
          echo "list=$list" | tee -a "$GITHUB_OUTPUT"

  # lock-check, lint, fmt-check, flake-deps, seeds-check, in that order.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # cog check reads the commit subjects since the last tag
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1"
      # `uv sync --locked`: a stale uv.lock fails here rather than being
      # silently re-locked (bead seeds-3p1).
      - run: just setup
      - run: just checks

  test:
    needs: versions
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false # report every version, not only the first to fail
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.list) }}
    env:
      PY: ${{ matrix.python }}
      UV_LOCKED: "1" # as in `just ci`: a re-lock fails instead of passing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1"
      # `seeds search` uses ripgrep when it is on PATH and Python otherwise.
      # The suite tests both engines only when rg is present, so make sure.
      - run: rg --version || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - run: just setup
      - run: |
          if [ "$PY" = "$(cat .python-version)" ]; then just test; else just test-python "$PY"; fi

  # Mirrors `just nix-check`; the recipe's comments explain the two-run split.
  nix-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Enables nix-command and flakes, so `just nix-check` needs no extra flags.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1"
      - run: just nix-check

  # Branch protection requires a check named `ci`, and Dependabot's auto-merge
  # waits for it, so this job keeps that name and passes only when every job
  # above succeeded. `always()` matters: without it, a failed job makes this
  # one SKIPPED, and GitHub counts a skipped required check as passing.
  ci:
    if: always()
    needs: [versions, checks, test, nix-check]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
