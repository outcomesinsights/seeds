name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest --cov=seeds --cov-report=term-missing

  # A flake that silently rots is worse than no flake: once the README documents
  # `nix run github:outcomesinsights/seeds`, that path has to keep working, and
  # nothing else in CI exercises it. This job is also the only thing that notices
  # when a dependency floor in pyproject.toml outruns what nixpkgs-unstable ships.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enables the nix-command and flakes experimental features by default, so
      # the steps below need no --extra-experimental-features.
      - uses: DeterminateSystems/nix-installer-action@main
      # `flake check` — not `build` — because the pytest suite hangs off
      # checks.default; packages.default deliberately keeps doCheck off.
      #
      # Split into two runs on purpose. `--all-systems` alone does NOT skip
      # foreign systems gracefully: the nix the installer action ships tries to
      # BUILD checks.aarch64-linux and dies with "platform mismatch". (Locally,
      # nix 2.24 did silently skip them — which is why this looked green on a
      # dev box and still broke CI. Don't trust a local --all-systems run.)
      #
      #   1. --all-systems --no-build — evaluation coverage for every declared
      #      system, building nothing. This is what catches the seeds-808 class
      #      of bug: nixpkgs 26.11 dropping x86_64-darwin was an evaluation-time
      #      error, invisible to a native-only check.
      #   2. bare flake check — builds and runs the pytest suite, on the
      #      runner's own x86_64-linux.
      #
      # No emulation and no remote builders, so foreign systems get evaluation
      # coverage only and never a cross-arch build. That is the intended trade.
      - run: nix flake check --all-systems --no-build
      - run: nix flake check --print-build-logs
      - run: nix run . -- --version
